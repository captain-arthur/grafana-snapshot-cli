[project]
name = "grafana-snapshot-cli"
version = "0.1.0"
description = "Export Grafana 12 dashboard snapshots (metrics embedded in JSON) and import them back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0",
]

[project.scripts]
grafana-snapshots = "cli.snapshot_publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
